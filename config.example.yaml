# Пример конфига s2t_gguf_server.
#
# Файл ищется в таком порядке:
#   1. /etc/s2t_gguf_server/config.yaml
#   2. ./config.yaml (текущая директория)
# Первый найденный файл применяется целиком.
# Пропущенные поля берутся из значений по умолчанию; флаги командной строки
# имеют приоритет над конфигом.
#
# Скопируйте этот файл в одно из указанных мест и отредактируйте под себя.

# адрес HTTP-сервера
addr: ":8080"

# путь к GGUF-модели
model: "models/gigaam-v3-e2e-rnnt-q4_k.gguf"

# число потоков ggml
threads: 4

# лимит размера загружаемого аудио, МБ
max_upload_mb: 200

# уровень логирования: debug, info, warn, error
log_level: "error"
